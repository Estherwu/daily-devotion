<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>每日靈修與禱告</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }
        .top-btns {
            position: absolute;
            top: 25px;
            right: 30px;
            display: flex;
            gap: 10px;
        }
        .action-top-btn {
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .admin-btn { background-color: #2ed573; }
        .admin-btn:hover { background-color: #26af5f; }
        .prayer-btn { background-color: #ffa502; }
        .prayer-btn:hover { background-color: #ff9f1a; }

        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }

        /* 1. 日期選擇按鈕列 (今天在最左邊) */
        .date-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
        }
        .date-btn {
            flex: 0 0 auto;
            padding: 10px 14px;
            background: #f1f3f5;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            transition: all 0.2s;
        }
        .date-btn:hover { background: #e2e6ea; }
        .date-btn.active {
            background: #4a69bd;
            color: white;
            border-color: #385293;
            font-weight: bold;
        }

        /* 2. YouTube 影片顯示區 */
        .youtube-section {
            margin-bottom: 25px;
            text-align: center;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .youtube-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 3. 欄位內容樣式 */
        .field-box {
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 4px solid #4a69bd;
        }
        .field-title {
            font-size: 13px;
            color: #718093;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .field-content {
            font-size: 16px;
            line-height: 1.6;
            color: #2f3640;
            white-space: pre-wrap;
        }

        /* 語音按鈕區 */
        .audio-section {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .speak-btn {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
            transition: background 0.2s;
        }
        .speak-btn:hover { background-color: #5b4bc4; }
        .speak-btn.stop { background-color: #ff7675; }

        /* Modal 彈跳視窗 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-top: 0; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .form-group textarea { height: 90px; resize: vertical; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: #2ed573; color: white; }
        .btn-save:hover { background-color: #26af5f; }
        .btn-cancel { background-color: #dfe4ea; color: #57606f; }
        .btn-cancel:hover { background-color: #ced6e0; }
        .form-tip { font-size: 12px; color: #e67e22; margin-top: 4px; display: block; }

        .loading { text-align: center; padding: 40px; color: #718093; font-size: 16px; }
        .no-data { text-align: center; padding: 30px; color: #e74c3c; background: #fdf0ed; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-btns">
        <button class="action-top-btn prayer-btn" onclick="openPrayerModal()">🙏 代禱</button>
        <button class="action-top-btn admin-btn" onclick="checkPassword()">＋ 資料</button>
    </div>

    <h2>📖 每日靈修與禱告</h2>
    
    <div id="loading" class="loading">正在載入靈修資料，請稍候...</div>
    
    <div id="dateBar" class="date-bar" style="display: none;"></div>

    <div id="youtubeContainer" class="youtube-section" style="display: none;">
        <div id="ytPlayerWrapper" style="width:100%; height:100%;"></div>
    </div>

    <div id="displayArea"></div>

    <div id="audioSection" class="audio-section" style="display: none;">
        <button id="speakBtn" class="speak-btn" onclick="toggleSpeech()">🔊 朗讀經文與禱告 (Microsoft Yating)</button>
    </div>
</div>

<!-- 管理員 Modal -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>📝 新增或編輯靈修資料</h3>
        <form id="addDataForm" onsubmit="submitNewData(event)">
            <div class="form-group">
                <label>選擇日期 (欄位 A，唯一)</label>
                <input type="date" id="inputDate" onchange="checkDateExist()" required>
                <span id="dateTip" class="form-tip"></span>
            </div>
            <div class="form-group">
                <label>文件序號</label>
                <input type="text" id="inputSerial" placeholder="例如：DEV-2026-101" required>
            </div>
            <div class="form-group">
                <label>聖經經文</label>
                <textarea id="inputVerse" placeholder="輸入經文內容..." required></textarea>
            </div>
            <div class="form-group">
                <label>我們一起禱告</label>
                <textarea id="inputPrayer" placeholder="輸入禱告內容..." required></textarea>
            </div>
            <div class="form-group">
                <label>今日默想</label>
                <textarea id="inputMeditation" placeholder="輸入默想內容..." required></textarea>
            </div>
            <div class="form-group">
                <label>YouTube 連結 (選填)</label>
                <input type="url" id="inputYoutube" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <div class="modal-btns">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="submit" id="saveBtn" class="btn-save">儲存並更新</button>
            </div>
        </form>
    </div>
</div>

<!-- 訪客：請為我代禱 Modal (語音直接轉文字填入欄位) -->
<div id="prayerModal" class="modal">
    <div class="modal-content">
        <h3>🙏 請為我代禱</h3>
        <p style="font-size: 13px; color: #666; text-align: center;">您可以點擊下方按鈕開始語音說話，系統會自動將語音轉為文字填入代禱內容中。</p>
        <form id="prayerForm" onsubmit="submitPrayer(event)">
            <div class="form-group">
                <label>名字</label>
                <input type="text" id="prayerName" placeholder="請輸入您的名字" required>
            </div>
            <div class="form-group">
                <label>電話</label>
                <input type="tel" id="prayerPhone" placeholder="請輸入您的聯絡電話" required>
            </div>
            <div class="form-group">
                <label>代禱內容 (可手動修改或語音輸入)</label>
                <textarea id="prayerTextContent" placeholder="請在此輸入或透過語音轉文字填寫代禱需求..." required></textarea>
            </div>
            <div class="form-group" style="background: #f1f2f6; padding: 12px; border-radius: 6px; text-align: center;">
                <label style="margin-bottom: 8px; font-size: 13px;">🎤 語音轉文字輸入</label>
                <button type="button" id="sttBtn" onclick="toggleSpeechToText()" style="background:#ff4757; color:white; border:none; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:14px;">開始語音輸入</button>
                <span id="sttStatus" style="font-size: 12px; margin-left: 8px; color:#555;">未開始</span>
            </div>
            <div class="modal-btns">
                <button type="button" class="btn-cancel" onclick="closePrayerModal()">取消</button>
                <button type="submit" id="prayerSubmitBtn" class="btn-save" style="background-color: #ffa502;">送出代禱</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ⚠️ 請換成你的 Apps Script 部署網址
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyY5zIp1QK8mPszE-ltIRWVax-k5H_OHUQgi6SF4Ack18rOeXH3ZnJHCnsiuK3GN06D/exec';

    let globalData = [];
    let currentDateStr = '';
    let selectedRowData = null;
    let adminPassword = "";

    function checkPassword() {
        let pwd = prompt("請輸入管理員密碼以新增/編輯資料：");
        if (pwd === null) return;
        
        if (pwd.trim() !== "") {
            adminPassword = pwd;
            document.getElementById('adminModal').style.display = 'flex';
            
            let today = new Date().toISOString().split('T')[0];
            document.getElementById('inputDate').value = today;
            checkDateExist();
        } else {
            alert("❌ 請輸入密碼。");
        }
    }

    function checkDateExist() {
        const selectedDate = document.getElementById('inputDate').value;
        const tipEl = document.getElementById('dateTip');
        const existingRow = globalData.find(row => row.date === selectedDate);
        
        if (existingRow) {
            tipEl.style.color = '#e67e22';
            tipEl.textContent = 'ℹ️ 該日期已有資料，修改後儲存將會更新現有內容。';
            document.getElementById('inputSerial').value = existingRow.serial || '';
            document.getElementById('inputVerse').value = existingRow.verse || '';
            document.getElementById('inputPrayer').value = existingRow.prayer || '';
            document.getElementById('inputMeditation').value = existingRow.meditation || '';
            document.getElementById('inputYoutube').value = existingRow.youtube || '';
        } else {
            tipEl.style.color = '#2ed573';
            tipEl.textContent = '✨ 該日期尚無資料，將新增一筆新紀錄。';
            document.getElementById('inputSerial').value = '';
            document.getElementById('inputVerse').value = '';
            document.getElementById('inputPrayer').value = '';
            document.getElementById('inputMeditation').value = '';
            document.getElementById('inputYoutube').value = '';
        }
    }

    function closeModal() {
        document.getElementById('adminModal').style.display = 'none';
        document.getElementById('addDataForm').reset();
        document.getElementById('dateTip').textContent = '';
    }

    async function submitNewData(e) {
        e.preventDefault();
        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = '儲存中...';

        const payload = {
            action: "saveDevotion",
            password: adminPassword,
            date: document.getElementById('inputDate').value,
            serial: document.getElementById('inputSerial').value,
            verse: document.getElementById('inputVerse').value,
            prayer: document.getElementById('inputPrayer').value,
            meditation: document.getElementById('inputMeditation').value,
            youtube: document.getElementById('inputYoutube').value
        };

        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === 'success') {
                alert('🎉 資料儲存成功！');
                closeModal();
                init();
            } else {
                alert('❌ 儲存失敗：' + (result.message || '密碼錯誤或系統異常'));
            }
        } catch (error) {
            console.error(error);
            alert('❌ 儲存失敗，請檢查網路連線。');
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = '儲存並更新';
        }
    }

    function openPrayerModal() {
        document.getElementById('prayerModal').style.display = 'flex';
    }

    function closePrayerModal() {
        document.getElementById('prayerModal').style.display = 'none';
        document.getElementById('prayerForm').reset();
        document.getElementById('sttStatus').textContent = '未開始';
        if (recognition && isListening) {
            recognition.stop();
            isListening = false;
        }
    }

    // --- 🎤 語音轉文字核心邏輯 (Speech Recognition) ---
    let recognition = null;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW'; // 設定辨識語言為繁體中文
        recognition.continuous = true; // 持續聆聽
        recognition.interimResults = true; // 即時顯示辨識結果

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript;
            }
            // 自動將辨識到的文字即時填入代禱內容欄位
            document.getElementById('prayerTextContent').value = transcript;
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error', event.error);
            document.getElementById('sttStatus').textContent = '辨識發生錯誤，請重試';
            resetSttButton();
        };

        recognition.onend = () => {
            resetSttButton();
        };
    }

    function toggleSpeechToText() {
        if (!recognition) {
            alert('很抱歉，您的瀏覽器不支援語音辨識功能，請使用 Google Chrome 或手機版瀏覽器。');
            return;
        }

        const btn = document.getElementById('sttBtn');
        const status = document.getElementById('sttStatus');

        if (!isListening) {
            try {
                recognition.start();
                isListening = true;
                btn.textContent = '停止聆聽';
                btn.style.background = '#2ed573';
                status.textContent = '🔴 正在聆聽您說話...';
            } catch (err) {
                console.error(err);
            }
        } else {
            recognition.stop();
            isListening = false;
            resetSttButton();
        }
    }

    function resetSttButton() {
        const btn = document.getElementById('sttBtn');
        const status = document.getElementById('sttStatus');
        btn.textContent = '開始語音輸入';
        btn.style.background = '#ff4757';
        if (status.textContent.includes('正在聆聽')) {
            status.textContent = '已完成語音輸入';
        }
        isListening = false;
    }

    async function submitPrayer(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('prayerSubmitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '傳送中...';

        const payload = {
            action: "submitPrayer",
            name: document.getElementById('prayerName').value,
            phone: document.getElementById('prayerPhone').value,
            prayerText: document.getElementById('prayerTextContent').value,
            hasAudio: false
        };

        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (result.status === 'success') {
                alert('🙏 您的代禱請求已順利送出，我們已透過 Gmail 通知管理員！');
                closePrayerModal();
            } else {
                throw new Error();
            }
        } catch (err) {
            alert('❌ 傳送失敗，請檢查網路連線。');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '送出代禱';
        }
    }

    function getLast7Days() {
        let dates = [];
        for (let i = 0; i <= 6; i++) {
            let d = new Date();
            d.setDate(d.getDate() - i);
            let year = d.getFullYear();
            let month = ('0' + (d.getMonth() + 1)).slice(-2);
            let day = ('0' + d.getDate()).slice(-2);
            dates.push(`${year}-${month}-${day}`);
        }
        return dates;
    }

    async function init() {
        try {
            const response = await fetch(WEB_APP_URL);
            globalData = await response.json();
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dateBar').style.display = 'flex';
            document.getElementById('audioSection').style.display = 'block';

            renderDateBar();
        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = '❌ 載入失敗，請檢查網址或網路連線。';
        }
    }

    function renderDateBar() {
        const dateBar = document.getElementById('dateBar');
        dateBar.innerHTML = '';
        const last7Days = getLast7Days();

        currentDateStr = last7Days[0];

        last7Days.forEach(dateStr => {
            const btn = document.createElement('button');
            btn.className = `date-btn ${dateStr === currentDateStr ? 'active' : ''}`;
            btn.textContent = dateStr;
            btn.onclick = () => {
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDateStr = dateStr;
                renderContent(dateStr);
            };
            dateBar.appendChild(btn);
        });

        renderContent(currentDateStr);
    }

    function renderContent(dateStr) {
        const displayArea = document.getElementById('displayArea');
        const ytContainer = document.getElementById('youtubeContainer');
        const ytWrapper = document.getElementById('ytPlayerWrapper');
        selectedRowData = globalData.find(row => row.date === dateStr);

        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            resetSpeakButton();
        }

        if (!selectedRowData) {
            displayArea.innerHTML = `<div class="no-data">📅 ${dateStr} 目前沒有對應的靈修內容。您可以點擊右上角「＋資料」新增。</div>`;
            ytContainer.style.display = 'none';
            return;
        }

        ytContainer.style.display = 'flex';
        const videoId = extractYouTubeID(selectedRowData.youtube);
        if (videoId) {
            ytWrapper.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}" 
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>`;
        } else {
            ytWrapper.innerHTML = '<div class="no-data" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#222; color:#aaa;">今日無 YouTube 影片</div>';
        }

        displayArea.innerHTML = `
            <div class="field-box">
                <div class="field-title">聖經經文</div>
                <div class="field-content">${selectedRowData.verse || '無'}</div>
            </div>
            <div class="field-box">
                <div class="field-title">我們一起禱告</div>
                <div class="field-content">${selectedRowData.prayer || '無'}</div>
            </div>
            <div class="field-box">
                <div class="field-title">今日默想</div>
                <div class="field-content">${selectedRowData.meditation || '無'}</div>
            </div>
        `;
    }

    function extractYouTubeID(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    const synth = window.speechSynthesis;
    let voices = [];

    function loadVoices() { voices = synth.getVoices(); }
    loadVoices();
    if (synth.onvoiceschanged !== undefined) { synth.onvoiceschanged = loadVoices; }

    function toggleSpeech() {
        const btn = document.getElementById('speakBtn');

        if (synth.speaking) {
            synth.cancel();
            resetSpeakButton();
            return;
        }

        if (!selectedRowData) return;

        const textToSpeak = `
            聖經經文：${selectedRowData.verse}。
            我們一起禱告：${selectedRowData.prayer}。
            今日默想：${selectedRowData.meditation}。
        `;

        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        let targetVoice = null;
        targetVoice = voices.find(v => v.name.includes('Yating') || v.name.includes('Xiaoxiao'));
        if (!targetVoice) { targetVoice = voices.find(v => v.name.includes('Mei-Jia') || v.name.includes('Meijia')); }
        if (!targetVoice) { targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh_TW'); }
        if (!targetVoice) { targetVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn')); }
        
        if (targetVoice) { utterance.voice = targetVoice; }

        utterance.rate = 0.9;
        utterance.pitch = 1.0;

        utterance.onstart = () => {
            btn.textContent = '⏹ 停止朗讀';
            btn.classList.add('stop');
        };
        utterance.onend = () => { resetSpeakButton(); };
        utterance.onerror = () => { resetSpeakButton(); };

        synth.speak(utterance);
    }

    function resetSpeakButton() {
        const btn = document.getElementById('speakBtn');
        btn.textContent = '🔊 朗讀經文與禱告 (Microsoft Yating)';
        btn.classList.remove('stop');
    }

    init();
</script>

</body>
</html>
